name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed to publish the APK as a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The build signs the debug APK with ./debug.keystore. It is committed so every build
      # has the same signature (lets you install updates over an older build). If it is
      # missing, generate one so the build still works.
      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # compileSdk 36.1 may not be preinstalled; Gradle downloads it once licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Reader-${GITHUB_RUN_NUMBER}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Reader-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      # Every push to main (or v* tag) gets a Release with the APK attached, so you can
      # download it from the Releases page without opening the Actions run.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "Reader $TAG" --generate-notes --latest
